# Render blueprint: one web service that serves the web app and the API.
# Starter plan (about $7/month): always on, so the site never sleeps after 15 idle minutes like the free plan did.
# Keys are entered in the Render dashboard, never committed.
services:
  - type: web
    name: chart-academy-career-coach
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORTKEY_API_KEY
        sync: false
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_EMAIL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: DATABASE_URL # Postgres for accounts (free Neon database); without it, accounts stay off
        sync: false
